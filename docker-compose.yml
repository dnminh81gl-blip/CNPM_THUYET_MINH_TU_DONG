# Chay toan bo backend: docker compose up --build
# RabbitMQ UI: http://localhost:15672 (guest / guest)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbit-compose
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-service:
    build: ./backend/tourguide/content-service/content-service
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  narration-service:
    build: ./backend/tourguide/narration-service/narration-service
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  translation-service:
    build: ./backend/tourguide/translation-service/translation-service
    ports:
      - "8083:8083"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  tts-service:
    build: ./backend/tourguide/tts-service/tts-service
    ports:
      - "8084:8084"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./backend/tourguide/notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Cong vao duy nhat cho Frontend: http://localhost:8080
  api-gateway:
    build: ./backend/tourguide/api-gateway
    ports:
      - "8080:8080"
    environment:
      CONTENT_URL: http://content-service:8081
      NARRATION_URL: http://narration-service:8082
      TRANSLATION_URL: http://translation-service:8083
      TTS_URL: http://tts-service:8084
      NOTIFICATION_URL: http://notification-service:8085
    depends_on:
      - content-service
      - narration-service
      - translation-service
      - tts-service
      - notification-service
