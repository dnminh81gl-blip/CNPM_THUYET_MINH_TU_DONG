name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            path: backend/tourguide/api-gateway
          - service: content-service
            path: backend/tourguide/content-service/content-service
          - service: narration-service
            path: backend/tourguide/narration-service/narration-service
          - service: translation-service
            path: backend/tourguide/translation-service/translation-service
          - service: tts-service
            path: backend/tourguide/tts-service/tts-service
          - service: notification-service
            path: backend/tourguide/notification-service
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    services:
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml
      - name: Build & test
        run: mvn -B verify

  # CD: build Docker image; khi code vao main thi day image len GitHub Container Registry (GHCR)
  #   ghcr.io/<chu-repo>/tourguide-<service>:latest va :<ma-commit>
  # Pull request chi build de kiem tra, khong day image.
  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            path: backend/tourguide/api-gateway
          - service: content-service
            path: backend/tourguide/content-service/content-service
          - service: narration-service
            path: backend/tourguide/narration-service/narration-service
          - service: translation-service
            path: backend/tourguide/translation-service/translation-service
          - service: tts-service
            path: backend/tourguide/tts-service/tts-service
          - service: notification-service
            path: backend/tourguide/notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tourguide-${{ matrix.service }}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" ${{ matrix.path }}
      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
