name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: content-service
            path: backend/tourguide/content-service/content-service
          - service: narration-service
            path: backend/tourguide/narration-service/narration-service
          - service: translation-service
            path: backend/tourguide/translation-service/translation-service
          - service: notification-service
            path: backend/tourguide/notification-service
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    services:
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml
      - name: Build & test
        run: mvn -B verify

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: content-service
            path: backend/tourguide/content-service/content-service
          - service: narration-service
            path: backend/tourguide/narration-service/narration-service
          - service: translation-service
            path: backend/tourguide/translation-service/translation-service
          - service: notification-service
            path: backend/tourguide/notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tourguide/${{ matrix.service }}:ci ${{ matrix.path }}
